<body data-pointer="coarse">

<a class="skip-link u-label" href="#main">Skip to content</a>

<div class="backdrop" aria-hidden="true"></div>

<header class="site-header">
  <a class="brand" href="/" aria-label="Nikole Ugueto — home">
    <span class="brand__mark">N</span>
    <span class="brand__rule" aria-hidden="true"></span>
    <span class="brand__name u-label">Nikole Ugueto</span>
  </a>
  <nav class="site-nav u-label" aria-label="Primary">
    <a href="/" aria-current="page">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </nav>
</header>

<main id="main">
  <noscript>
    <div class="noscript">
      <p><strong>This portfolio needs JavaScript</strong> — the work is reached by
      travelling through it, and that machinery is scripted.</p>
      <p>You can still reach me directly:
        <a href="mailto:nikoleugueto@gmail.com">nikoleugueto@gmail.com</a> ·
        New York, NY</p>
    </div>
  </noscript>

  <section class="hero" aria-labelledby="hero-title">

    <!-- The artwork. Annotations are injected here so they stay in the same
         coordinate space and inherit the camera transform. -->
    <div class="plate" id="plate" style="--fx:.55; --fy:.30">
      <img class="plate__img"
           src="/assets/img/hero-plate-760.webp"
           srcset="/assets/img/hero-plate-760.webp 760w,
                   /assets/img/hero-plate-1140.webp 1140w,
                   /assets/img/hero-plate-1195.webp 1195w"
           sizes="(min-width: 1180px) 46vw, 120vw"
           width="1195" height="1202" fetchpriority="high" decoding="async"
           alt="Nikole Ugueto in profile, her hair rendered as a city of towers, parks and roads — the worlds inside her mind.">

      <button class="brain" id="brain" type="button"
              aria-describedby="brain-hint">
        <span class="u-visually-hidden">Enter the worlds inside my mind — four bodies of work</span>
      </button>
    </div>

    <div class="hero__copy">
      <h1 class="hero__title reveal" id="hero-title" style="--delay:220ms">
        I create meaningful<br>digital experiences<br>for the world behind the interface.
      </h1>
    </div>

    <button class="enter-cue reveal" id="enter-cue" type="button" style="--delay:520ms">
      <svg class="enter-cue__ring" width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle class="track" cx="17" cy="17" r="11"></circle>
        <circle class="fill"  cx="17" cy="17" r="11" pathLength="100" style="--ring-len:100"></circle>
      </svg>
      <span class="enter-cue__stem" aria-hidden="true"></span>
      <span class="u-label" id="enter-cue-label">Scroll to explore</span>
    </button>

    <p class="u-visually-hidden" id="brain-hint">
      Scroll, or activate this control, to move into the city inside the portrait
      and reach the four worlds.
    </p>

    <!-- Stacked composition only: the annotations as a readable index. -->
    <nav class="hero__mobile-index" id="world-index" aria-label="The worlds"></nav>
  </section>
</main>

<div class="veil" aria-hidden="true"></div>

<!-- Destination layer -->
<section class="stage" id="stage" aria-hidden="true" tabindex="-1"></section>

<!-- Pointer portrait + its static counterpart -->
<div class="cursor" id="cursor" aria-hidden="true">
  <img class="cursor__img" src="/assets/img/portrait-cursor.webp" width="360" height="360" alt="" decoding="async">
  <span class="cursor__caption u-label" id="cursor-caption"></span>
</div>
<div class="portrait-badge" aria-hidden="true">
  <img src="/assets/img/portrait-cursor.webp" width="360" height="360" alt="" decoding="async" loading="lazy">
</div>

<p class="u-visually-hidden" role="status" aria-live="polite" id="live"></p>
